spring:
  application:
    name: doodok-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:doodok}
    username: ${DB_USERNAME:doodok}
    password: ${DB_PASSWORD:doodok}

  jpa:
    open-in-view: false
    hibernate:
      # 테이블은 Flyway 마이그레이션으로만 만든다. JPA는 엔티티와 테이블이 맞는지 검사만 한다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    locations: classpath:db/migration
    # 이름 규칙(V1__설명.sql)을 어긴 파일이 조용히 무시되지 않고 시작 시 실패하도록
    validate-migration-naming: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # 로컬 기본값은 Mailpit. 운영에서는 환경 변수로 AWS SES SMTP 값을 넣는다.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

doodok:
  auth:
    jwt-secret: ${JWT_SECRET:}
    secure-cookie: ${AUTH_SECURE_COOKIE:true}
  mail:
    from: ${MAIL_FROM:no-reply@doodok.local}

server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  tomcat:
    remoteip:
      internal-proxies: '${TRUSTED_PROXY_PATTERN:(?!)}'

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
