# 로컬 개발용 인프라: PostgreSQL(pgvector 포함) + Redis
# 실행: docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: doodok-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-doodok}
      POSTGRES_USER: ${DB_USERNAME:-doodok}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-doodok}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-doodok} -d ${DB_NAME:-doodok}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: doodok-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
